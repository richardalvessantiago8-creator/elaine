<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELAINE</title>
</head>

<body>

    <h1>ELAINE</h1>

    <input
        id="mensagem"
        type="text"
        placeholder="Fale com a ELAINE..."
    >

    <button onclick="falarComElaine()">
        Enviar
    </button>

    <p id="resposta"></p>

    <script>
        async function falarComElaine() {
            const campo = document.getElementById("mensagem");
            const resposta = document.getElementById("resposta");

            const mensagem = campo.value.trim();

            if (!mensagem) return;

            resposta.textContent = "ELAINE está pensando...";

            try {
                const resultado = await fetch("/elaine", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        mensagem: mensagem
                    })
                });

                const dados = await resultado.json();

                resposta.textContent = dados.resposta;

            } catch (erro) {
                resposta.textContent =
                    "Não consegui conectar com a ELAINE.";

                console.error(erro);
            }
        }
    </script>

</body>

</html>
