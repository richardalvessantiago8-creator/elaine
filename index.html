<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELAINE AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050509;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #08080f;
            border-right: 1px solid #25253a;
            padding: 25px 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .menu button {
            display: block;
            width: 100%;
            background: transparent;
            border: 0;
            color: #aaa;
            text-align: left;
            padding: 14px;
            margin-bottom: 7px;
            border-radius: 10px;
            font-size: 14px;
        }

        .menu button:hover {
            background: #171722;
            color: white;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at center,
                    #17102b 0%,
                    #07070c 60%
                );
        }

        .topbar {
            height: 65px;
            border-bottom: 1px solid #25253a;
            display: flex;
            align-items: center;
            padding: 0 25px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #aaa;
            font-size: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #8b5cf6;
            box-shadow: 0 0 12px #8b5cf6;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .welcome {
            text-align: center;
            margin-top: 12vh;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 1px solid #8b5cf6;
            background: #120d20;
            box-shadow: 0 0 35px rgba(139, 92, 246, .35);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #888;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            margin: 12px 0;
            border-radius: 15px;
            line-height: 1.5;
        }

        .user {
            margin-left: auto;
            background: #7041df;
        }

        .elaine {
            background: #151520;
            border: 1px solid #29293d;
        }

        .input-area {
            padding: 18px;
            border-top: 1px solid #25253a;
            background: #06060a;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 10px;
            padding: 7px;
            background: #11111b;
            border: 1px solid #292941;
            border-radius: 14px;
        }

        #mensagem {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            color: white;
            padding: 12px;
            font-size: 15px;
        }

        #mensagem::placeholder {
            color: #777;
        }

        #enviar {
            border: 0;
            background: #7c4dff;
            color: white;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        #enviar:active {
            transform: scale(.97);
        }

        .profile {
            width: 240px;
            background: #08080f;
            border-left: 1px solid #25253a;
            padding: 30px 20px;
            text-align: center;
        }

        .profile-avatar {
            width: 75px;
            height: 75px;
            margin: 10px auto 15px;
            border-radius: 50%;
            border: 1px solid #8b5cf6;
            background: #151124;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }

        .profile p {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .line {
            height: 1px;
            background: #25253a;
            margin: 25px 0;
        }

        .info {
            text-align: left;
            color: #aaa;
            font-size: 13px;
            line-height: 2;
        }

        @media (max-width: 900px) {
            .sidebar,
            .profile {
                display: none;
            }

            .messages {
                padding: 20px;
            }

            .message {
                max-width: 90%;
            }

            .welcome h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">
            ELAINE<span>.</span>
        </div>

        <div class="menu">
            <button>＋ Nova conversa</button>
            <button>⌂ Início</button>
            <button>◉ Conversas</button>
            <button>⚙ Configurações</button>
        </div>
    </aside>


    <main class="chat">

        <header class="topbar">
            <div class="status">
                <div class="dot"></div>
                ELAINE • Online
            </div>
        </header>


        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <div class="avatar">E</div>

                <h1>Olá, eu sou a ELAINE.</h1>

                <p>
                    Sua assistente virtual está pronta.
                </p>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <input
                    id="mensagem"
                    type="text"
                    placeholder="Fale com a ELAINE..."
                    autocomplete="off"
                >

                <button id="enviar">
                    Enviar
                </button>

            </div>

        </div>

    </main>


    <aside class="profile">

        <div class="profile-avatar">E</div>

        <h2>ELAINE</h2>

        <p>Assistente Artificial</p>

        <div class="line"></div>

        <div class="info">
            <div>● Sistema: Online</div>
            <div>● Conexão: Ativa</div>
            <div>● Interface: ELAINE</div>
        </div>

    </aside>

</div>


<script>

    const campo = document.getElementById("mensagem");
    const botao = document.getElementById("enviar");
    const messages = document.getElementById("messages");


    async function falarComElaine() {

        const mensagem = campo.value.trim();

        if (!mensagem) {
            return;
        }


        const welcome = document.getElementById("welcome");

        if (welcome) {
            welcome.remove();
        }


        const usuario = document.createElement("div");

        usuario.className = "message user";
        usuario.textContent = mensagem;

        messages.appendChild(usuario);


        campo.value = "";


        const resposta = document.createElement("div");

        resposta.className = "message elaine";
        resposta.textContent = "ELAINE está pensando...";

        messages.appendChild(resposta);


        messages.scrollTop = messages.scrollHeight;


        try {

            /*
             * Usa exatamente o mesmo servidor
             * que abriu esta página.
             */

            const resultado = await fetch(
                window.location.origin + "/elaine",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        mensagem: mensagem
                    })
                }
            );


            if (!resultado.ok) {
                throw new Error(
                    "Servidor respondeu: " +
                    resultado.status
                );
            }


            const dados = await resultado.json();

            resposta.textContent = dados.resposta;


        } catch (erro) {

            console.error(erro);

            resposta.textContent =
                "Não consegui conectar com a ELAINE.";

        }


        messages.scrollTop = messages.scrollHeight;

    }


    botao.addEventListener(
        "click",
        falarComElaine
    );


    campo.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                falarComElaine();
            }

        }
    );

</script>

</body>
</html><link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#08080f">
